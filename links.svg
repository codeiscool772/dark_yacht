<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" style="display:block;background:#ffffff">
  <title>Links - Dark Yacht</title>
  <desc>The shared link list, drawn as an SVG document.</desc>

  <foreignObject x="0" y="0" width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml"
         style="height:100%; overflow:auto; box-sizing:border-box; padding:20px; font-family:Arial,sans-serif; font-size:16px; color:#000000; background:#ffffff">

      <style>
        h1, h3 { margin-bottom: 5px; }
        hr { margin: 10px 0; border: 0; border-top: 1px solid #ccc; }
        .link-row {
            margin: 12px 0;
            padding-bottom: 8px;
            border-bottom: 1px dashed #ddd;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .tag-label { color: #555555; font-weight: bold; font-size: 14px; }
        .mini-btn {
            background-color: #f5f5f5;
            border: 1px solid #ccc;
            padding: 3px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s ease;
        }
        .mini-btn:hover { background-color: #e8e8e8; border-color: #999; }
        .mini-btn.active-like { background-color: #d4edda; border-color: #28a745; color: #155724; }
        .mini-btn.active-dislike { background-color: #f8d7da; border-color: #dc3545; color: #721c24; }
        .mini-btn.active-report { background-color: #fff3cd; border-color: #ffc107; color: #856404; }
        .mini-btn-report:hover { background-color: #ffcccc; border-color: #ff3333; color: #b30000; }
        .mini-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .mini-btn.active-sort { background-color: #e8e8e8; border-color: #999; font-weight: bold; }
        .small-note { color: #777777; font-size: 12px; }
        [hidden] { display: none !important; }
      </style>

      <h1>Dark Yacht Link Hub</h1>
      <hr/>
      <p>Post a site link and assign it a tag. Updates globally for everyone.</p>
      <hr/>

      <h3>Submit a New Link</h3>
      <input type="text" id="siteUrl" placeholder="https://example.com" size="40"/>
      <select id="siteTag"></select>
      <input type="text" id="customTag" list="tagOptions" placeholder="your tag" size="20" maxlength="24" hidden="hidden"/>
      <datalist id="tagOptions"/>
      <button type="button" id="postBtn">Submit Link</button>
      <div class="small-note" id="postStatus"></div>
      <hr/>

      <h3>Shared Directory</h3>
      <div class="small-note" style="margin-bottom: 8px;">
        sort:
        <button type="button" class="mini-btn" id="sortNew">newest</button>
        <button type="button" class="mini-btn" id="sortScore">top score</button>
      </div>
      <div id="linksDisplay">Loading global link stream...</div>
      <p class="small-note"><a href="index.svg">hub</a> &#183; <a href="tags.svg">tags</a></p>

      <script src="app-links.js"></script>
    </div>
  </foreignObject>
</svg>
