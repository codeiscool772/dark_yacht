<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notepad - caek</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        h1 { margin-bottom: 5px; }
        hr { margin: 10px 0; border: 0; border-top: 1px solid #ccc; }
        .mini-btn {
            background-color: #f5f5f5;
            border: 1px solid #ccc;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }
        .mini-btn:hover { background-color: #e8e8e8; border-color: #999; }
        .small-note { color: #777777; font-size: 12px; }
        .bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
        textarea {
            width: 100%;
            box-sizing: border-box;
            height: 65vh;
            min-height: 280px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: Consolas, "Courier New", monospace;
            font-size: 14px;
            line-height: 1.5;
            resize: vertical;
        }
        textarea:focus { outline: none; border-color: #888; }
    </style>
</head>
<body>
    <h1>Notepad</h1>
    <div class="small-note"><a href="index.html">back to hub</a></div>
    <hr>

    <div class="bar">
        <button type="button" class="mini-btn" id="downloadBtn">Download .txt</button>
        <button type="button" class="mini-btn" id="clearBtn">Clear</button>
        <span class="small-note" id="status"></span>
    </div>

    <textarea id="note" spellcheck="true" placeholder="type here, it saves itself"></textarea>

    <script>
    const STORE_KEY = "y_cht_note";
    const note = document.getElementById("note");
    const status = document.getElementById("status");
    let timer = null;

    function setStatus(text) {
        status.textContent = text || "";
    }

    try {
        note.value = localStorage.getItem(STORE_KEY) || "";
    } catch (err) {
        setStatus("this browser is blocking local saving");
    }

    note.addEventListener("input", () => {
        clearTimeout(timer);
        timer = setTimeout(() => {
            try {
                localStorage.setItem(STORE_KEY, note.value);
                setStatus("saved in this browser");
            } catch (err) {
                setStatus("could not save locally");
            }
        }, 300);
    });

    document.getElementById("downloadBtn").addEventListener("click", () => {
        const blob = new Blob([note.value], { type: "text/plain" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "note.txt";
        link.click();
        URL.revokeObjectURL(link.href);
    });

    document.getElementById("clearBtn").addEventListener("click", () => {
        if (!confirm("Clear the note?")) return;
        note.value = "";
        try {
            localStorage.removeItem(STORE_KEY);
        } catch (err) {
            /* ignore */
        }
        setStatus("cleared");
        note.focus();
    });
    </script>
</body>
</html>
